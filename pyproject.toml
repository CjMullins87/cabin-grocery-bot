[project]
name = "grocery-bot"
version = "0.1.0"
description = "Grocery bot for hungry animals"
authors = [
    {name = "CedarBou"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot (>=22.4,<23.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
